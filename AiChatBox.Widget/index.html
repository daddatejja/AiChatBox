<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiChatBox Integration Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #1e293b; }
        p { color: #64748b; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome to Your App</h1>
        <p>This is a demonstration of how easy it is to plug the <strong>AiChatBox</strong> widget into any project. Look at the bottom right corner!</p>
        <p>Just add a script tag and one HTML element. That's it.</p>
    </div>

    <!-- START OF AICHATBOX INTEGRATION -->
    <!-- 1. The custom element -->
    <ai-chatbox 
        css-path="ai-chatbox.css"
        provider="gemini"
        api-url="https://localhost:44385"
        api-key="acb_aMz8LIH1lqc0jRZs97oafzMPXr1ci0sR">
    </ai-chatbox>

    <!-- 2. The script -->
    <script src="ai-chatbox.js"></script>
    <!-- END OF AICHATBOX INTEGRATION -->

</body>
</html>
