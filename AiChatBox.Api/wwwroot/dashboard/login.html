<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AiChatBox</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 2.5rem; text-align: center; }
        .oauth-btn { width: 100%; margin-bottom: 0.75rem; justify-content: center; }
    </style>
</head>
<body>
    <script>
        // Init theme immediately to prevent flash
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <div class="login-card card animate-in">
        <div class="logo" style="justify-content: center; margin-bottom: 2rem;">
            <div class="logo-icon"></div>
            <span>AiChatBox</span>
        </div>
        
        <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2.5rem; font-size: 0.95rem;">Secure access to your AI control center</p>

        <div style="margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
            <button class="btn btn-outline oauth-btn" onclick="externalLogin('Google')">
                <img src="https://www.google.com/favicon.ico" width="18" height="18" style="margin-right: 0.5rem;">
                Continue with Google
            </button>
            <button class="btn btn-outline oauth-btn" onclick="externalLogin('GitHub')">
                <img src="https://github.com/favicon.ico" width="18" height="18" class="github-icon" style="margin-right: 0.5rem;">
                Continue with GitHub
            </button>
        </div>

        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; color: var(--text-secondary); font-size: 0.75rem; font-weight: 700;">
            <hr style="flex: 1; border: 0; border-top: 1px solid var(--ghost-border);">
            OR
            <hr style="flex: 1; border: 0; border-top: 1px solid var(--ghost-border);">
        </div>

        <form id="form-login">
            <div class="form-group" style="text-align: left;">
                <label>Developer Email</label>
                <input type="email" id="login-email" placeholder="dev@company.com" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Secure Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Sign In to Dashboard
            </button>
        </form>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: var(--text-secondary);">
            Need an account? <a href="#" style="color: var(--primary-indigo); font-weight: 600; text-decoration: none;">Request Developer Access</a>
        </p>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // Check if token in URL (from OAuth callback)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            localStorage.setItem('acb_token', token);
            window.location.href = 'index.html';
        }

        document.getElementById('form-login').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = 'Verifying...';
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('acb_token', data.token);
                    window.location.href = 'index.html';
                } else {
                    alert('Invalid credentials. Please try again.');
                    btn.innerText = 'Sign In to Dashboard';
                }
            } catch (err) {
                alert('Connection error. Is the API running?');
                btn.innerText = 'Sign In to Dashboard';
            }
        };

        function externalLogin(provider) {
            window.location.href = `${API_BASE}/api/auth/external-login/${provider}`;
        }
    </script>
</body>
</html>
