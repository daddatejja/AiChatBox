<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiChatBox Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="index.html" class="logo">
                <div class="logo-icon"></div>
                <span>AiChatBox</span>
            </a>
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link active">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            Projects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="docs.html" class="nav-link">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                            Documentation
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" id="btn-logout">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                            Logout
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div class="theme-toggle">
                <button class="btn btn-outline" style="width: 100%" onclick="toggleTheme()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    Toggle Theme
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>My Projects</h1>
                    <p style="color: var(--text-secondary)">Manage your AI agents and tool configurations</p>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button class="btn btn-primary" id="btn-create-project">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Create Project
                    </button>
                    <div class="user-profile">
                        <div class="avatar"></div>
                        <span id="user-name" style="font-weight: 600; font-size: 0.9rem;">Loading...</span>
                    </div>
                </div>
            </header>

            <div class="grid" id="projects-grid">
                <!-- Projects will be loaded here -->
            </div>
        </main>
    </div>

    <!-- Create Project Modal -->
    <div class="modal-overlay" id="modal-create">
        <div class="modal glass">
            <h2>Create New Project</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">Configure your AI agent's personality and tools.</p>
            <form id="form-create-project">
                <div class="form-group">
                    <label>Project Name</label>
                    <input type="text" id="proj-name" placeholder="My Awesome Project" required>
                </div>
                <div class="form-group">
                    <label>Provider</label>
                    <select id="proj-provider">
                        <option value="gemini">Google Gemini</option>
                        <option value="groq">Groq (Llama 3)</option>
                        <option value="grok">xAI Grok</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>System Prompt</label>
                    <textarea id="proj-prompt" rows="4" placeholder="You are a helpful assistant..."></textarea>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal('modal-create')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Project</button>
                </div>
            </form>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
